services:
  streambridge:
    build:
      context: .
    container_name: streambridge
    restart: unless-stopped
    ports:
      - "7002:7000"
    environment:
      NODE_ENV: production
      PORT: 7000
      JELLYFIN_INDEX_PAGE_SIZE: 100
      JELLYFIN_FALLBACK_PAGE_SIZE: 25
      JELLYFIN_INDEX_MAX_PAGES: 2000
      JELLYFIN_REQUEST_TIMEOUT_MS: 30000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
